name: Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Host tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify host logic, descriptors and WebHID protocol
        run: |
          node --version
          make -C tests check
          make -C tests sanitize
          python3 -m unittest discover -s tests -p 'test_pack*.py' -v

  build:
    name: ${{ matrix.board }} / ${{ matrix.usb }}
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        board: [lctech616, aim61, m0sdock]
        usb: [fs, hs]
    env:
      BL_SDK_BASE: ${{ github.workspace }}/.deps/bouffalo_sdk
      CMAKE_CMD: cmake
      BOARD_TYPE: ${{ matrix.board }}
      USB_SPEED: ${{ matrix.usb }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read dependency pins
        run: |
          source .github/ci/dependencies.env
          echo "SDK_REPOSITORY=$SDK_REPOSITORY" >> "$GITHUB_ENV"
          echo "SDK_REF=$SDK_REF" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_SHA256=$TOOLCHAIN_SHA256" >> "$GITHUB_ENV"
      - name: Check out DS5Dongle SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: .deps/bouffalo_sdk
          persist-credentials: false
      - name: Cache pinned toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps/toolchain
          key: xuantie-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_SHA256 }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build xz-utils libusb-1.0-0
          bash .github/ci/install-toolchain.sh
      - name: Compile firmware
        run: |
          test "$(git -C "$BL_SDK_BASE" rev-parse HEAD)" = "$SDK_REF"
          set -o pipefail
          bash build_macos.sh build 2>&1 | tee firmware-build.log
      - name: Assemble flashing package
        run: python3 scripts/package_firmware.py --board "$BOARD_TYPE" --usb "$USB_SPEED"
      - name: Upload firmware package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.usb }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-${{ matrix.board }}-${{ matrix.usb }}
          path: |
            firmware-build.log
            build/build_out/*.elf
            build/build_out/*.map
            build/generated/defconfig.cmake
          if-no-files-found: ignore
          retention-days: 14

  control-center:
    name: Desktop control center
    uses: ./.github/workflows/control-center.yml

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build, control-center]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Download control center packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: control-center-*
          path: dist
          merge-multiple: true
      - name: Verify packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'ds5dongle-*.zip' | wc -l)" -eq 6
          for package in \
            DS5-Control-Center-windows-amd64.zip \
            DS5-Control-Center-macos-arm64.zip \
            DS5-Control-Center-macos-x86_64.zip \
            DS5-Control-Center-portable.zip; do
            test -s "dist/$package"
          done
          (cd dist && sha256sum *.zip > SHA256SUMS)
          cp docs/RELEASE_NOTES_CN.md "$RUNNER_TEMP/release-notes.md"
          printf '\n源码提交：`%s`\n\n[GitHub Actions 构建记录](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --draft \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG · DS5 控制中心" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
