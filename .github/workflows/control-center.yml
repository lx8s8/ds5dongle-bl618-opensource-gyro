name: Control center
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify browser protocols and local launcher
        run: |
          node tests/web_protocol_test.mjs
          node tests/control_center_test.mjs
          node tests/boot_manager_test.mjs
          node tests/macros_test.mjs
          node tests/flasher_test.mjs
          node tests/updates_test.mjs
          node tests/dual_firmware_test.mjs
          node tests/ui_helpers_test.mjs
          python -m unittest discover -s tests -p "test_launcher.py" -v
      - name: Build self-contained application
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          python scripts/package_control_center.py --native
          python tests/test_native_launcher.py
          python scripts/package_control_center.py
      - name: Upload applications
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: control-center-${{ matrix.os }}
          path: dist/control-center/*.zip
          if-no-files-found: error
